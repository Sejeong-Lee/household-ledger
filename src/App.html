<script>
/* ===== Household Ledger v2 — screen logic =====
   Engine.html (loaded first) is the old app's pure functions, cut as-is.
   Globals the engine expects are defined here: ST, $, money, pad, titleCase, acctOf,
   checkSource, renderFiles, renderReview, setAsk. Four engine functions are replaced
   below (predict wrapper, extractPrompt, readPdf, readImage) so Claude calls go through
   google.script.run.callClaude and PDF/screenshot totals get verified. */

const $=id=>document.getElementById(id);
const money=(n,d=2)=>Number(n).toLocaleString("en-SG",{minimumFractionDigits:d,maximumFractionDigits:d});
const pad=n=>String(n).padStart(2,"0");
const titleCase=s=>String(s||"").toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gs=(fn,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function prevMonth(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function shiftMonth(m,n){const [y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function monthLabel(m){const [y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})}

const ST={cfg:{fx:{},ratio:{Ankit:0.6,Sejeong:0.4},income:{}},S:{},accts:[],hist:[],idx:buildIndex([]),pend:[],files:[],uid:0,fid:0,
  month:prevMonth(),me:{name:"",email:""},rules:[],sheetRules:[],fxLive:{},usage:null,sample:null,mode:"sheet",
  view:"upload",flt:"mine",showConf:false,mView:"cat",mSel:null,mMonth:"",mAll:false,busy:false,ask:"",loaded:false};
const S=(k,d)=>{const v=ST.S[k];return v===undefined||v===""||v===null?d:v};
const acctOf=name=>ST.accts.find(a=>a.name===name)||{name,owner:"Joint",currency:"SGD",sign:""};
const uploadable=a=>!/^(manual|none|no|off|skip|n\/a)$/i.test(String(a.collection||"").trim());
const myAccts=()=>ST.accts.filter(a=>a.owner===ST.me.name&&uploadable(a));
const jointAccts=()=>ST.accts.filter(a=>a.owner==="Joint"&&uploadable(a));
const otherName=()=>PEOPLE.find(p=>p!==ST.me.name)||"";
const nameOf=email=>{const v=ST.S["user_"+String(email).toLowerCase()];return v||email};
const shareName=s=>!s?"whose: from history":s==="Owner"?"Owner's personal":s;

/* ---------- small helpers ---------- */
function toObjs(rows){const h=(rows[0]||[]).map(x=>String(x).trim());return rows.slice(1).filter(r=>r.some(c=>c!==""&&c!=null)).map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]);return o})}
function errMsg(e){let m=(e&&(e.msg||e.message))||String(e||"Something went wrong.");m=String(m).replace(/^Exception:\s*/,"").replace(/^Error:\s*/,"");
  if(/permission|access denied|do not have access|requested entity was not found/i.test(m)&&!/Claude API/i.test(m))return "No access to the ledger sheet. Ask Sejeong to share it with this Google account.";return m}
function banner(msg){const b=$("banner");if(!msg){b.hidden=true;b.innerHTML="";return}b.hidden=false;b.innerHTML=`<div style="flex:1">${esc(msg)}</div><button class="link" data-c="closeBanner" style="padding:0">✕</button>`}
function parseJson(t){t=String(t||"").trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");try{return JSON.parse(t)}catch(e){}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  throw {msg:"Claude's reply couldn't be read. Please try again."}}
const modelLabel=m=>/sonnet/i.test(m)?"Sonnet":/opus/i.test(m)?"Opus":"Haiku";
/* rules tab: key, cat, sub, share, memo, set_by, set_at, conf, note. key "re:..." = regex on the raw description (case-insensitive), otherwise exact normKey().key */
function compileRules(){
  ST.sheetRules=[];
  for(const r of ST.rules){
    const key=String(r.key||"").trim();if(!key||!TAX[r.cat]||!TAX[r.cat].includes(r.sub))continue;
    const o={cat:r.cat,sub:r.sub,share:String(r.share||"").trim(),memo:String(r.memo||""),conf:String(r.conf||"mid").trim().toLowerCase()==="high"?"high":"mid",set_by:String(r.set_by||""),note:String(r.note||"")};
    if(/^re:/i.test(key)){try{o.re=new RegExp(key.slice(3),"i")}catch(e){continue}}else o.key=key;
    ST.sheetRules.push(o);
  }
}
const reindex=()=>{ST.idx=buildIndex(ST.hist);compileRules()};
const whoOf=h=>h.share==="Shared"?"Shared":h.share==="Personal - Ankit"?"Ankit":"Sejeong";
const WHO={Shared:"#2d6a52",Ankit:"#3f6fb0",Sejeong:"#c46a1c"};
const WC={Shared:"#5fb98f",Ankit:"#7ea6dc",Sejeong:"#e39a5a"};

/* ---------- engine hooks ---------- */
ST.sample={
  async json(prompt,o={}){const model=o.model||S("model_classify","claude-haiku-5-5");
    const r=await gs("callClaude",model,o.system||"Reply with JSON only. No prose, no markdown fences.",o.content||prompt,o.maxTokens||8000);
    return parseJson(r.text)},
  async limits(){return {images:true}}
};
/* classification order: engine RULES (high) → rules tab (high) → history, same key → rules tab (mid) → similar key → fee follows parent → AI */
function matchRule(row,n,conf){return ST.sheetRules.find(r=>r.conf===conf&&(r.re?r.re.test(row.desc):(n.key&&r.key===n.key)))||null}
function ruleResult(r,row,idx,n){
  let share=r.share;
  if(share==="Owner")share=row.owner==="Joint"?"Shared":"Personal - "+row.owner;
  else if(!share){const ex=idx.key.get(n.key);share=ex&&ex.length?vote(ex,row.owner).share:""}
  const unresolved=!share,who=r.set_by==="seed"?"Preset rule":"Saved rule"+(r.set_by?" by "+nameOf(r.set_by):"");
  return {cat:r.cat,sub:r.sub,share:share||"Shared",memo:r.memo,conf:unresolved&&r.conf==="high"?"mid":r.conf,src:"rule",why:who+(unresolved?". Please pick whose it is.":".")};
}
predict=function(row,idx){
  const n=normKey(row.desc);
  for(const r of RULES)if(r.conf==="high"&&r.re.test(row.desc))return {...r.p,memo:"",conf:"high",src:"rule",why:r.why};
  const hi=matchRule(row,n,"high");if(hi)return ruleResult(hi,row,idx,n);
  if(n.incoming&&row.amt!=null&&row.amt<0)return {cat:"EAT",sub:"Dine out",share:"Shared",memo:"",conf:"mid",src:"rule",why:"Money in from someone. Treated as their share of a meal, which lowers your spend."};
  const ex=idx.key.get(n.key);
  if(ex&&ex.length){
    const v=vote(ex,row.owner),high=v.n>=2&&v.agreeL>=0.75&&v.agreeS>=0.75;
    return {cat:v.cat,sub:v.sub,share:v.share,memo:v.memo,conf:high?"high":"mid",src:"history",why:`Seen ${v.n}× before${v.n>1?`, ${Math.round(Math.min(v.agreeL,v.agreeS)*100)}% the same way`:""}.`};
  }
  const mid=matchRule(row,n,"mid");if(mid)return ruleResult(mid,row,idx,n);
  for(const r of RULES)if(r.re.test(row.desc))return {...r.p,memo:"",conf:r.conf,src:"rule",why:r.why};
  const near=(idx.k2.get(n.k2)||[]).length?idx.k2.get(n.k2):(n.k1.length>=4?idx.k1.get(n.k1):null);
  if(near&&near.length){const v=vote(near,row.owner);return {cat:v.cat,sub:v.sub,share:v.share,memo:v.memo,conf:"mid",src:"similar",why:`Similar to “${n.k2||n.k1}” seen ${v.n}× before.`}}
  return null;
};
/* exchange rate: month-end rate from the fx tab; in the current month only, today's GOOGLEFINANCE rate (settings fx_live_*) as a provisional stand-in */
const thisMonth=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)};
toSgd=function(p){
  p.fxProv=false;if(p.cur==="SGD")return Math.round(p.orig*100)/100;
  let r=+((ST.cfg.fx[p.m]||{})[p.cur]);
  if(!(r>0)&&p.m===thisMonth()&&ST.fxLive[p.cur]>0){r=ST.fxLive[p.cur];p.fxProv=true}
  return r>0?Math.round(p.orig*r*100)/100:null;
};
/* new merchants: one Claude call per upload (a merchant that appears on several rows is asked once), 3 nearest past rows as examples each */
async function askClaude(list){
  if(!list.length)return;
  const keyOf=p=>normKey(p.desc).key||String(p.desc).toUpperCase(),groups=new Map();
  list.forEach(p=>{const k=keyOf(p);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)});
  const reps=[...groups.values()].map(g=>g[0]);
  setAsk(`Claude is classifying ${reps.length} new merchant${reps.length>1?"s":""}…`);
  try{
    for(let i=0;i<reps.length;i+=100){
      const batch=reps.slice(i,i+100),ex=new Set();
      batch.forEach(p=>nearest(p.desc,ST.idx,3).forEach(h=>ex.add(h)));
      const exl=[...ex].map(h=>`${h.desc.slice(0,70)} | ${h.amt} | paid by ${h.owner} | ${h.cat}/${h.sub} | ${h.share}${h.memo?" | "+h.memo.slice(0,40):""}`).join("\n");
      const prompt=`Classify household transactions for Ankit and Sejeong, a couple in Singapore (Sejeong also has Korean accounts). Learn their habits from the examples, then label each new row.
Categories (category: sub-categories): ${JSON.stringify(TAX)}
Share is one of: "Shared" (household spending for both), "Personal - Ankit", "Personal - Sejeong", "Excluded" (not spending: transfers between their own accounts, card bill payments, investments, savings, loan interest bookkeeping).
Amounts are SGD; positive = money out, negative = money in (a refund or someone paying them back).
Past examples (description | SGD | paid by | category/sub | share | memo):
${exl}

New rows (id | description | SGD | paid by):
${batch.map(p=>`${p.id} | ${p.desc.slice(0,90)} | ${p.amt??p.orig+" "+p.cur} | ${p.owner}`).join("\n")}

Reply with ONLY a JSON array of objects {"id":number,"cat":string,"sub":string,"share":string,"memo":string,"conf":number between 0 and 1,"why":string under 12 words}. memo is a 2-5 word plain note like the examples, or "".`;
      const r=await ST.sample.json(prompt);
      (Array.isArray(r)?r:[]).forEach(o=>{
        const rep=batch.find(b=>b.id===+o.id);if(!rep||!TAX[o.cat]||!TAX[o.cat].includes(o.sub)||!SHARES.includes(o.share))return;
        const memo=String(o.memo||""),why="New merchant. Claude: "+String(o.why||"").slice(0,90);
        (groups.get(keyOf(rep))||[rep]).forEach(p=>{p.pred={cat:o.cat,sub:o.sub,share:o.share,memo,conf:(+o.conf>=0.85?"mid":"low"),src:"claude",why};p.lab={cat:o.cat,sub:o.sub,share:o.share,memo}});
      });
      renderReview();
    }
  }catch(e){console.error(e);banner(errMsg(e)+" The remaining new merchants need a category picked by hand.")}
  list.filter(p=>!p.pred).forEach(p=>{p.pred={cat:"ETC",sub:"Etc",share:"Shared",memo:"",conf:"low",src:"none",why:"New merchant. Please pick a category."};p.lab={...p.pred}});
  setAsk("");renderReview();
}
function checkSource(x,src){
  const s=String(src||"").toLowerCase().replace(/[^a-z0-9가-힣 ]/g," ");if(!s.trim())return;
  const toks=String(x.acct).toLowerCase().replace(/[^a-z0-9가-힣 ]/g," ").split(/\s+/).filter(t=>t.length>=3&&!/^(card|account|acct|ankit|sejeong|joint)$/.test(t));
  if(toks.length&&!toks.some(t=>s.includes(t)))x.warn=`This looks like “${src}”, not ${x.acct}. Check the account.`;
}
function setAsk(t){ST.ask=t||"";const el=$("ask");if(el)el.textContent=ST.ask}

/* statement extraction: Haiku first; if the printed total disagrees, only that file is re-read by Sonnet */
function extractPrompt(acct,src){
  return `You are extracting transactions from a ${src} of a personal bank or card account (the user says it is "${acct.name}", default currency ${acct.currency}). The statement month is ${ST.month}.
Return ONLY a JSON object: {"source":"the bank, card or app name visible in the document, or empty if none is shown","total":{"out":123.45,"in":0}|null,"rows":[{"date":"YYYY-MM-DD","desc":"merchant or description exactly as printed","amount":12.34,"dir":"out"|"in","cur":"SGD"}]}.
Rules:
- amount is a positive number in the currency the account is charged in. For foreign spending on an SGD card use the SGD amount, not the foreign one. Korean statements are KRW.
- dir "out" = purchases, fees, interest charged, transfers or payments sent; "in" = refunds, cashback, credits, money received, card payments received.
- total = the statement's own printed totals (for example total new charges, total debits, total credits), as positive numbers in the account currency. out = total money out, in = total money in. Copy them from the document; never add rows up yourself. Use null for a figure that is not printed, or null for the whole total if none is printed.
- Skip opening/closing balances, running balance columns, subtotals, minimum payment lines, reward points, and anything that is not a single transaction.
- If the year is not printed, use the year that puts the date in or just before ${ST.month}.
- No prose, no markdown fences.`;
}
async function extractVerified(x,acct,src,parts){
  const run=async model=>{
    let rows=[],tot=null,out=0,inn=0;
    for(const part of parts){
      const prompt=extractPrompt(acct,src);
      const imgs=part.images||(part.image?[part.image]:null);
      const content=imgs?[...imgs.map(im=>({type:"image",source:im})),{type:"text",text:prompt}]:prompt+"\n\n"+part.text;
      const r=await gs("callClaude",model,"You extract bank statement data. Reply with JSON only.",content,8000);
      const j=parseJson(r.text);const arr=Array.isArray(j)?j:(j&&Array.isArray(j.rows)?j.rows:[]);
      rows=rows.concat(fromLLM(j,acct,x));
      arr.forEach(q=>{const a=Math.abs(+q.amount);if(!isFinite(a)||!q.desc)return;if(q.dir==="in")inn+=a;else out+=a});
      if(tot==null&&j&&j.total&&typeof j.total==="object"&&j.total.out!=null&&isFinite(+j.total.out))tot=+j.total.out;
    }
    return {rows,out,inn,tot};
  };
  const verdict=r=>r.tot==null?"none":(Math.abs(r.out-r.tot)<=0.01||Math.abs(r.out-r.inn-r.tot)<=0.01)?"ok":"off";
  const m1=S("model_extract","claude-haiku-5-5"),m2=S("model_retry","claude-sonnet-5-5");
  x.st="asking";x.model=modelLabel(m1);renderFiles();
  let r=await run(m1),v=verdict(r),retried=false;
  if(v==="off"){retried=true;x.model=modelLabel(m1)+" → "+modelLabel(m2);renderFiles();r=await run(m2);v=verdict(r)}
  const who=retried?`${modelLabel(m1)} total was off → re-read with ${modelLabel(m2)}`:modelLabel(m1);
  if(v==="ok")x.note=`${who} · total matches statement ✓`;
  else if(v==="none")x.note=`${who} · no printed total to check, so look over the rows`;
  else{x.note=`⚠ ${who} · rows add up to ${money(r.out)} but the statement says ${money(r.tot)}. Check the rows.`;x.flag=true}
  return r.rows;
}
async function pdfPageImages(pdf){
  const out=[];if(!pdf)return out;
  for(let p=1;p<=Math.min(pdf.numPages,12);p++){
    const pg=await pdf.getPage(p),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(2,1600/Math.max(v0.width,v0.height))});
    const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    out.push({type:"base64",media_type:"image/jpeg",data:c.toDataURL("image/jpeg",0.85).split(",")[1]});
  }
  return out;
}
async function readPdf(x,acct){
  const pages=await pdfText(x);
  const chunks=[];let cur="";for(const p of pages){if(cur.length+p.length>40000&&cur){chunks.push(cur);cur=""}cur+=p+"\n\n"}if(cur.trim())chunks.push(cur);
  if(!chunks.length){ /* scanned or image-only PDF: draw the pages and read them as images, same checks as a screenshot */
    const imgs=await pdfPageImages(x.pdfDoc);
    if(!imgs.length)throw {msg:"This PDF has no readable text. Upload a screenshot of it instead."};
    const parts=[];for(let i=0;i<imgs.length;i+=6)parts.push({images:imgs.slice(i,i+6)});
    return extractVerified(x,acct,"PDF statement (page images attached)",parts);
  }
  return extractVerified(x,acct,"PDF statement (text below)",chunks.map(ch=>({text:"STATEMENT TEXT:\n"+ch})));
}
function fileImage(f){
  return new Promise((ok,no)=>{
    const rd=new FileReader();rd.onerror=()=>no({msg:"Couldn't open this image."});
    rd.onload=()=>{
      const url=rd.result,type=f.type||"image/png";
      if(f.size<1500000&&/^image\/(png|jpeg|webp|gif)$/.test(type))return ok({type:"base64",media_type:type,data:String(url).split(",")[1]});
      const im=new Image();im.onerror=()=>no({msg:"This image format isn't supported. Use PNG or JPG."});
      im.onload=()=>{const k=Math.min(1,2400/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok({type:"base64",media_type:"image/jpeg",data:c.toDataURL("image/jpeg",0.9).split(",")[1]})};
      im.src=url};
    rd.readAsDataURL(f)});
}
async function readImage(x,acct){
  const img=await fileImage(x.f);
  return extractVerified(x,acct,"screenshot of a banking or card app (attached image)",[{image:img}]);
}

/* ---------- loading ---------- */
function load(b){
  ST.me={email:b.email,name:b.name};
  ST.S={};toObjs(b.settings).forEach(o=>{ST.S[String(o.key).trim()]=o.value});
  ST.accts=toObjs(b.accounts).filter(a=>a.name).map(a=>({...a,name:String(a.name).trim(),owner:String(a.owner).trim(),currency:String(a.currency||"SGD").trim()}));
  ST.cfg.fx={};toObjs(b.fx).forEach(o=>{const m=String(o.month).slice(0,7),c=String(o.currency).trim();if(m&&c)(ST.cfg.fx[m]=ST.cfg.fx[m]||{})[c]=o.rate_to_sgd});
  const rA=parseFloat(ST.S.ratio_ankit);ST.cfg.ratio={Ankit:isFinite(rA)?rA:0.6};ST.cfg.ratio.Sejeong=1-ST.cfg.ratio.Ankit;
  ST.cfg.income={Sejeong:parseFloat(ST.S.income_sejeong)||0,Ankit:parseFloat(ST.S.income_ankit)||0};
  ST.hist=b.transactions.slice(1).map(rowFromSheet).filter(h=>h.id&&h.status!=="deleted");
  ST.rules=toObjs(b.rules).filter(r=>r.key);
  ST.fxLive={};["KRW","INR","USD"].forEach(c=>{const v=parseFloat(ST.S["fx_live_"+c]);if(v>0)ST.fxLive[c]=v});
  ST.usage=b.usage;reindex();
  const months=[...new Set(ST.hist.map(h=>h.m))].sort();ST.mMonth=months.length?months[months.length-1]:ST.month;
  ST.loaded=true;
}
async function boot(){
  renderAll();
  try{load(await gs("getBootstrap"));banner("")}catch(e){banner(errMsg(e))}
  renderAll();
}
async function refreshUsage(){try{ST.usage=await gs("getUsage");if(ST.view==="settings")renderSettings()}catch(e){}}

/* ---------- navigation ---------- */
const pendingLeft=()=>ST.pend.filter(p=>p.st==="pending").length;
function go(v){ST.view=v;renderAll()}
function renderNav(){
  $("who").textContent=ST.me.name||"…";
  const tabs=[["upload","Upload"],["review","Review"+(ST.pend.length?" · "+pendingLeft():"")],["month","Month"],["settings","Settings"]];
  $("tabs").innerHTML=tabs.map(([k,l])=>`<button class="${ST.view===k?"on":""}" data-c="tab" data-id="${k}">${esc(l)}</button>`).join("");
  ["upload","review","month","settings"].forEach(k=>{$("v-"+k).hidden=ST.view!==k});
}
function renderAll(){renderNav();({upload:renderUpload,review:renderReviewView,month:renderMonth,settings:renderSettings})[ST.view]();renderFoot()}
function renderFoot(){
  const f=$("foot");
  if(ST.view==="upload"){
    const queued=ST.files.filter(x=>x.st==="queued"||x.st==="error"&&x.again).length,read=ST.pend.length;
    f.hidden=false;
    f.innerHTML=`<div><div class="footl"><span id="ask">${esc(ST.ask)}</span>${ST.ask?"":`${read} rows read · ${queued} file${queued===1?"":"s"} waiting`}</div>`+
      (queued?`<button class="btn ml" data-c="run" ${ST.busy?"disabled":""}>${ST.busy?"Working…":"Classify → Review"}</button>`:read?`<button class="btn ml" data-c="tab" data-id="review">Go to Review</button>`:"")+`</div>`;
  }else if(ST.view==="review"){
    const ok=ST.pend.filter(p=>p.st==="ok").length,rj=ST.pend.filter(p=>p.st==="rej").length;
    f.hidden=!ST.pend.length;
    f.innerHTML=`<div><div class="footl mono">✓ ${ok} · ✕ ${rj} · left ${pendingLeft()}</div><button class="btn ml" data-c="save" ${ST.busy||!ok?"disabled":""}>${ST.busy?"Saving…":"Save to sheet"}</button></div>`;
  }else f.hidden=true;
}
function renderReview(){renderNav();if(ST.view==="review")renderReviewView();if(ST.view==="upload")renderFoot()}

/* ---------- Upload ---------- */
function acctDone(a,m){return ST.hist.some(h=>h.acct===a.name&&h.m===m&&h.status!=="provisional")||ST.files.some(x=>x.acct===a.name&&x.month===m&&x.st==="done")}
function guessAcct(name){
  const n=name.toLowerCase().replace(/[^a-z0-9가-힣]/g,"");let best=null,bs=0;
  for(const a of ST.accts){const k=a.name.toLowerCase().replace(/[^a-z0-9가-힣]/g,"");if(k.length>bs&&n.includes(k)){best=a;bs=k.length}}
  if(best)return best.name;
  const cand=[...myAccts(),...jointAccts()];let sc=0;
  for(const a of cand){const toks=a.name.toLowerCase().split(/[^a-z0-9가-힣]+/).filter(t=>t.length>=3&&!/^(card|account|acct|ankit|sejeong|joint)$/.test(t));const s=toks.filter(t=>n.includes(t)).length;if(s>sc){sc=s;best=a}}
  return best?best.name:"";
}
function guessMonth(name){
  const n=name.toLowerCase(),M="jan feb mar apr may jun jul aug sep oct nov dec".split(" ");let m;
  /* a statement dated in the first week of a month (2026-10-01_Statement.pdf) covers the month before */

async function readOne(x){

    else rows=await readImage(x,acct);

    /* statement month = the month most transactions fall in, unless the month was picked by hand */
    const cnt={};rows.forEach(r=>{const k=String(r.d||"").slice(0,7);if(k)cnt[k]=(cnt[k]||0)+1});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(top&&!x.monthSet&&top[0]!==x.month){x.month=top[0];ST.month=top[0];x.note=(x.note?x.note+" ":"")+"Month set to "+monthLabel(top[0])+" from the transaction dates."}

    x.st="done";x.rows=rows.length;return ps;

}

}
function downloadMonth(){
  const m=ST.mMonth,R=monthRows(m);
  const ws=XLSX.utils.json_to_sheet(R.map(h=>({Date:h.d,Description:h.desc,SGD:h.amt,Currency:h.cur,Original:h.orig,Account:h.acct,Owner:h.owner,Share:h.share,Category:h.cat,Sub:h.sub,Memo:h.memo,Status:h.status})));
  const cats=catTotals(R),ws2=XLSX.utils.json_to_sheet(Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({Category:k,SGD:Math.round(v*100)/100})));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"transactions");XLSX.utils.book_append_sheet(wb,ws2,"by category");
  XLSX.writeFile(wb,`Household-${m}.xlsx`);
}

/* ---------- Settings ---------- */
function renderSettings(){
  const el=$("v-settings");
  if(!ST.loaded){el.innerHTML=`<div class="card sub">Loading…</div>`;return}
  const u=ST.usage||{cost:0,cap:5,calls:0},p=Math.min(100,u.cost/(u.cap||5)*100);
  const cur=[...new Set([...ST.accts.map(a=>a.currency),...ST.pend.filter(x=>x.m===ST.month).map(x=>x.cur),...Object.keys(ST.cfg.fx[ST.month]||{})])].filter(c=>c&&c!=="SGD");
  const rules=ST.rules.slice().sort((a,b)=>String(b.set_at).localeCompare(String(a.set_at))).slice(0,100);
  el.innerHTML=`
    <div class="card"><div class="row"><h3>AI usage · ${esc(monthLabel(u.month||ST.month).split(" ")[0])}</h3><span class="mono ml" style="font-size:13px">$${u.cost.toFixed(2)} / $${u.cap}</span></div>
      <div class="meter" style="height:8px"><i style="width:${p}%;height:8px"></i></div>
      <div class="sub">${u.calls} AI call${u.calls===1?"":"s"} this month. Stops at the limit and tells you.</div></div>
    <div class="card"><h3>Accounts</h3>${ST.accts.map(a=>`<div class="li"><span style="flex:1;min-width:0">${esc(a.name)}</span><span class="pill">${esc(a.owner)}</span><span class="mono sub" style="width:34px;text-align:right">${esc(a.currency)}</span></div>`).join("")}</div>
    <div class="card"><div class="row"><h3>Learned merchant rules</h3><span class="mono ml sub">${ST.rules.length}</span></div>
      ${rules.map(r=>`<div class="li"><div style="flex:1;min-width:0"><div style="font-weight:500;overflow-wrap:anywhere">${esc(r.key)}</div><div class="sub">${esc(r.cat+" · "+r.sub+" · "+shareName(String(r.share||"").trim()))} · ${esc(String(r.conf||"mid"))} · ${r.set_by==="seed"?"preset":"set by "+esc(nameOf(r.set_by))}</div></div>${r.set_by==="seed"?"":`<button class="link" data-c="delrule" data-id="${esc(r.key)}">Delete</button>`}</div>`).join("")||`<div class="sub">No saved rules yet.</div>`}</div>
    <div class="grid2">
      <label class="card sub" style="gap:4px">Shared split (Ankit %)<input type="number" min="0" max="100" class="inp mono" style="width:80px" value="${Math.round(ST.cfg.ratio.Ankit*100)}" data-g="ratio"></label>
      <div class="card sub" style="gap:4px">Month-end rates<span style="font-size:11px">Filled automatically on the last night of each month. Type a rate only to override.</span>${ST.S.fx_warning?`<span style="font-size:11.5px;color:var(--red)">${esc(ST.S.fx_warning)}</span>`:""}<input type="month" class="inp" value="${ST.month}" data-g="fxmonth">
        ${cur.map(c=>`<div class="row"><span class="mono">${esc(c)}</span><input type="number" step="any" class="inp mono" style="flex:1" placeholder="SGD per 1 ${esc(c)}" value="${esc((ST.cfg.fx[ST.month]||{})[c]||"")}" data-g="fx" data-id="${esc(c)}"></div>`).join("")||`<span>No foreign currencies.</span>`}</div>
    </div>`;
}
function recalcFx(){ST.pend.forEach(p=>{if(p.cur!=="SGD"){p.amt=toSgd(p)}})}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-c]");if(!b)return;const a=b.dataset.c,id=b.dataset.id;
  const sel={
    tab:()=>go(id),closeBanner:()=>banner(""),run:runAll,save:saveAll,
    flt:()=>{ST.flt=id;renderReviewView()},showConf:()=>{ST.showConf=!ST.showConf;renderReviewView()},
    approveAll:()=>{ST.pend.filter(p=>inFlt(p)&&isConf(p)&&p.st==="pending").forEach(p=>{p.st="ok"});renderReview()},
    ok:()=>{const p=pById(id);if(p){p.st=p.st==="ok"?"pending":"ok";if(p.st==="ok"){p.st="pending";approve(p)}renderReview()}},
    rej:()=>{const p=pById(id);if(p){p.st=p.st==="rej"?"pending":"rej";p.edit=false;renderReview()}},
    edit:()=>{const p=pById(id);if(p){p.edit=!p.edit;if(p.edit&&p.learn===undefined)p.learn=true;renderReviewView()}},
    rmfile:()=>{ST.files=ST.files.filter(x=>x.id!==+id);renderUpload()},
    retry:()=>{const x=ST.files.find(x=>x.id===+id);if(x){x.again=true;x.err="";renderUpload()}},
    unlock:()=>{const x=ST.files.find(x=>x.id===+id);if(x&&x.pwResolve)x.pwResolve(x.pwv||"")},
    mpick:()=>{ST.mSel=ST.mSel===id?null:id;renderMonth()},mclear:()=>{ST.mSel=null;renderMonth()},mall:()=>{ST.mAll=true;renderMonth()},
    mview:()=>{ST.mView=id;ST.mSel=null;renderMonth()},dl:downloadMonth,
    delrule:()=>{if(!confirm("Delete this rule?"))return;gs("deleteRule",id).then(()=>{ST.rules=ST.rules.filter(r=>r.key!==id);reindex();renderSettings()}).catch(err=>banner(errMsg(err)))}
  }[a];
  if(sel)sel();
});
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-g]");if(!t)return;const a=t.dataset.g,id=t.dataset.id,v=t.value,x=ST.files.find(x=>x.id===+id),p=pById(id);
  if(a==="upmonth"){ST.month=v||ST.month;ST.files.forEach(f=>{if(f.st==="queued")f.month=ST.month});renderUpload()}
  else if(a==="facct"&&x){x.acct=v}
  else if(a==="fmonth"&&x){x.month=v||x.month;x.monthSet=true}
  else if(a==="cat"&&p){const [c,s]=v.split("|");p.lab={...p.lab,cat:c,sub:s};renderReviewView()}
  else if(a==="share"&&p){p.lab={...p.lab,share:v};renderReviewView()}
  else if(a==="learn"&&p){p.learn=t.checked}
  else if(a==="mmonth"){ST.mMonth=v;ST.mSel=null;ST.mAll=false;renderMonth()}
  else if(a==="ratio"){const r=Math.min(100,Math.max(0,parseFloat(v)));if(!isFinite(r))return;gs("saveSetting","ratio_ankit",r/100).then(()=>{ST.cfg.ratio={Ankit:r/100,Sejeong:1-r/100};banner("")}).catch(err=>banner(errMsg(err)))}
  else if(a==="fxmonth"){ST.month=v||ST.month;renderSettings()}
  else if(a==="fx"){const rate=parseFloat(v);if(!(rate>0))return;gs("saveFx",ST.month,id,rate).then(()=>{(ST.cfg.fx[ST.month]=ST.cfg.fx[ST.month]||{})[id]=rate;recalcFx();banner("")}).catch(err=>banner(errMsg(err)))}
});
document.addEventListener("input",e=>{
  const t=e.target.closest("[data-i]");if(!t)return;const id=t.dataset.id;
  if(t.dataset.i==="memo"){const p=pById(id);if(p)p.lab={...p.lab,memo:t.value}}
  else if(t.dataset.i==="pw"){const x=ST.files.find(x=>x.id===+id);if(x)x.pwv=t.value}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.i==="pw"){const x=ST.files.find(x=>x.id===+e.target.dataset.id);if(x&&x.pwResolve)x.pwResolve(x.pwv||"")}
});
$("fileIn").addEventListener("change",e=>{addFiles([...e.target.files]);e.target.value=""});

boot();
</script>
